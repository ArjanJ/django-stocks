[project]
name = "django-challenge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "asgiref==3.11.1",
    "django==5.2.17",
    "djangorestframework==3.18.0",
    "pytz==2021.1",
    "sqlparse==0.6.0",
]

[project.optional-dependencies]
common = [
    "asgiref==3.11.1",
    "django==5.2.17",
    "djangorestframework==3.18.0",
    "pytz==2021.1",
    "sqlparse==0.6.0",
]
api = [
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "idna==3.19",
    "requests==2.34.2",
    "urllib3==2.7.0",
]
stock = [
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "idna==3.19",
    "requests==2.34.2",
    "urllib3==2.7.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

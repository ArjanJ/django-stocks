[project]
name = "django-challenge"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "asgiref==3.3.1",
    "django==3.1.7",
    "djangorestframework==3.12.4",
    "pytz==2021.1",
    "sqlparse==0.4.1",
]

[project.optional-dependencies]
common = [
    "asgiref==3.3.1",
    "django==3.1.7",
    "djangorestframework==3.12.4",
    "pytz==2021.1",
    "sqlparse==0.4.1",
]
api = [
    "certifi==2024.7.4",
    "chardet==4.0.0",
    "idna==2.10",
    "requests==2.25.1",
    "urllib3==1.26.4",
]
stock = [
    "certifi==2024.7.4",
    "chardet==4.0.0",
    "idna==2.10",
    "requests==2.25.1",
    "urllib3==1.26.4",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
